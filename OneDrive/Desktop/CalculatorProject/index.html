<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>1, 3, 5 계산기</title>
    <style>
        .calculator {
            width: 600px;
            margin: auto;
            border: 1px solid #6e58d0;
            padding: 10px;
        }
        .display {
            margin-bottom: 10px;
        }
        .display input {
            width: 100%;
            height: 30px;
            font-size: 24px;
            text-align: right;
        }
        .buttons {
            display: flex;
            flex-wrap: wrap;
        }
        .buttons button {
            width: 25%;
            height: 50px;
            font-size: 24px;
            background-color: #c1fffb;
            border: 1px solid #ffa8a8;
            margin: 5px;
        }
        .buttons button:hover {
            background-color: #838cff;
        }
        .operation {
            background-color: #ff44b1;
        }
        .calc-btn {
            background-color: #097e9c;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <input type="text" id="input" disabled>
        </div>
        <div class="buttons">
            <button class="number" value="1">1</button>
            <button class="number" value="2">2</button>
            <button class="number" value="3">3</button>
            <button class="number" value="4">4</button>
            <button class="number" value="5">5</button>
            <button class="number" value="6">6</button>
            <button class="number" value="7">7</button>
            <button class="number" value="8">8</button>
            <button class="number" value="9">9</button>
            <button class="number" value="0">0</button>
            <button class="operation" value="+">+</button>
            <button class="operation" value="-">-</button>
            <button class="operation" value="*">*</button>
            <button class="operation" value="/">/</button>
            <button class="clear" value="clear">C</button>
            <button class="calc-btn" value="=">=</button>
        </div>
    </div>

    <script>
        let input = document.getElementById('input');
        let buttons = document.querySelectorAll('button');
        let clear = document.querySelector('.clear');
        let calculate = document.querySelector('.calc-btn');


        buttons.forEach(button => {
            button.addEventListener('click', () => {
           
                if (button.value === '=') {
                    input.value = eval(input.value);
                } else if (button.value === 'clear') {
                    input.value = '';
                } else {
                    input.value += button.value;
                }
            });
        });
    </script>
</body>
</html>
